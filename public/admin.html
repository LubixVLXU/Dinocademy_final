<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Dinocademy — panel admina</title>
  <link href="favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="assets/index-C-lA4BJt.css" rel="stylesheet"/>
  <link href="assets/ui-extra.css" rel="stylesheet"/>
</head>
<body data-page="admin">
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="site-header">
    <div class="page-shell nav-shell">
      <a class="brand" href="index.html"><span>Dinocademy</span></a>
      <nav class="site-nav" aria-label="Główna nawigacja">
        <a href="index.html">Start</a>
        <a href="profil.html">Profil</a>
        <a aria-current="page" href="admin.html">Admin</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page-shell page-stack">
    <section class="page-hero compact-hero">
      <span class="eyebrow">Panel administratora</span>
      <h1>Zarządzaj użytkownikami, XP i forum.</h1>
      <p>Konto administratora może ręcznie dodawać XP, które od razu wpływa na poziom gracza i rozgrzewanie jaj.</p>
    </section>

    <section class="panel-glass admin-xp-panel">
      <h2>Dodaj XP użytkownikowi</h2>
      <form id="admin-xp-form" class="admin-xp-form">
        <label>Użytkownik ID
          <input name="userId" type="number" min="1" required>
        </label>
        <label>Ilość XP
          <input name="amount" type="number" min="1" step="1" required>
        </label>
        <button type="submit">Dodaj XP</button>
      </form>
      <p id="admin-xp-status" aria-live="polite"></p>
    </section>

    <section class="panel-glass">
      <h2>Użytkownicy</h2>
      <div id="admin-users"></div>
    </section>

    <section class="panel-glass">
      <h2>Forum</h2>
      <div id="admin-threads"></div>
    </section>
  </main>
  <script src="assets/admin.js"></script>
</body>
</html>
