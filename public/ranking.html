<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Dinocademy — ranking</title>
  <link href="favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="assets/index-C-lA4BJt.css" rel="stylesheet"/>
  <link href="assets/ui-extra.css" rel="stylesheet"/>
</head>
<body data-page="ranking">
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <header class="site-header">
    <div class="page-shell nav-shell">
      <a class="brand" href="index.html"><span>Dinocademy</span></a>
      <nav class="site-nav" aria-label="Główna nawigacja">
        <a href="index.html">Start</a>
        <a href="kursy.html">Kursy</a>
        <a href="gry.html">Gry</a>
        <a href="wykluwarnia.html">Wykluwarnia</a>
        <a aria-current="page" href="ranking.html">Ranking</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page-shell page-stack">
    <section class="page-hero compact-hero">
      <span class="eyebrow">Tablica wyników</span>
      <h1>Ranking z różnymi kategoriami sortowania.</h1>
      <p>Porównuj nie tylko najwyższe wyniki, ale też poziom gracza, łączne XP i wyniki dla konkretnych gier.</p>
    </section>
    <section class="panel-glass">
      <div class="ranking-toolbar">
        <label for="ranking-sort">Sortuj</label>
        <select id="ranking-sort">
          <option value="score">Najwyższy wynik</option>
          <option value="level">Poziom</option>
          <option value="xp">XP</option>
          <option value="game">Gra</option>
          <option value="player_name">Gracz</option>
        </select>
        <button id="clear-ranking" type="button">Wyczyść lokalny ranking</button>
      </div>
      <div id="ranking-table"></div>
    </section>
  </main>
  <script src="assets/recovery.js"></script>
  <script src="assets/ranking.js"></script>
</body>
</html>
