services:
  - type: web
    name: dinocademy
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/dinocademy.db
    disk:
      name: dinocademy-data
      mountPath: /var/data
      sizeGB: 1
